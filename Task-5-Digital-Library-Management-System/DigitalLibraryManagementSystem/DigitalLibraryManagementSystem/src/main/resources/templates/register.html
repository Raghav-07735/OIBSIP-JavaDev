<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="auth-wrap"><section class="auth-card"><p class="eyebrow">JOIN THE LIBRARY</p><h1>Create account</h1><div class="error" th:if="${error}" th:text="${error}"></div><form method="post" action="/register" class="stack"><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="6" required></label><button class="btn full" type="submit">Register</button></form><p class="muted">Already registered? <a href="/login">Login</a></p></section></main></body></html>
