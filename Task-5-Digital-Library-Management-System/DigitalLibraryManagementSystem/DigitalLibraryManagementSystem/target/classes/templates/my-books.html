<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Books</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container page"><p class="eyebrow">YOUR ACCOUNT</p><h1>My library activity</h1>
<section class="panel"><h2>Issued books</h2><div class="table-wrap"><table><thead><tr><th>Book</th><th>Issue date</th><th>Due date</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="l : ${loans}"><td th:text="${l.title}"></td><td th:text="${l.issue_date}"></td><td th:text="${l.due_date}"></td><td th:text="${l.status}"></td><td><form th:if="${l.status == 'ISSUED'}" th:action="@{/loans/{id}/return(id=${l.id})}" method="post"><button class="btn btn-small" type="submit">Return</button></form></td></tr><tr th:if="${loans.empty}"><td colspan="5">No borrowing history yet.</td></tr></tbody></table></div></section>
<section class="panel"><h2>Fines</h2><div class="table-wrap"><table><thead><tr><th>Book</th><th>Fine</th><th>Payment status</th></tr></thead><tbody><tr th:each="f : ${fines}"><td th:text="${f.title}"></td><td th:text="'₹' + ${f.amount}"></td><td th:text="${f.paid == 1 ? 'Paid' : 'Unpaid'}"></td></tr><tr th:if="${fines.empty}"><td colspan="3">No fines.</td></tr></tbody></table></div><p class="muted">Overdue fine: ₹5 per day. Contact the administrator to settle an unpaid fine.</p></section>
<section class="panel"><h2>Advance reservations</h2><div class="table-wrap"><table><thead><tr><th>Book</th><th>Reserved at</th><th>Status</th></tr></thead><tbody><tr th:each="r : ${reservations}"><td th:text="${r.title}"></td><td th:text="${r.reserved_at}"></td><td th:text="${r.status}"></td></tr><tr th:if="${reservations.empty}"><td colspan="3">No reservations.</td></tr></tbody></table></div></section></main></body></html>
